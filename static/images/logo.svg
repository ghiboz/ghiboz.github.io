<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SimCoder logo">
  <rect width="64" height="64" rx="12" fill="#24273a"/>
  <!-- steering wheel: rim with a red marker at 12 o'clock, three spokes, big hub -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#f2f7fb" stroke-width="5"/>
  <path d="M27.6 10.2 A22.5 22.5 0 0 1 36.4 10.2" fill="none" stroke="#e5533d" stroke-width="5"/>
  <g stroke="#f2f7fb" stroke-width="5.5">
    <line x1="10" y1="32" x2="24" y2="32"/>
    <line x1="40" y1="32" x2="54" y2="32"/>
    <line x1="32" y1="40" x2="32" y2="54"/>
  </g>
  <circle cx="32" cy="32" r="11.5" fill="#f2f7fb"/>
  <!-- // = code comment, on the hub -->
  <g stroke="#e5533d" stroke-width="3.6" stroke-linecap="round">
    <line x1="27.6" y1="38" x2="30.6" y2="26"/>
    <line x1="33.4" y1="38" x2="36.4" y2="26"/>
  </g>
</svg>
