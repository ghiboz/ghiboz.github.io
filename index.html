---
layout: default
title: Home
---

<div class="container">
    <div class="post-list">
        {% for post in site.posts %}
        <article class="post-preview">
            <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
            <time>{{ post.date | date: "%d %B %Y" }}</time>
            <p>{{ post.excerpt }}</p>
        </article>
        {% endfor %}
    </div>
</div>
